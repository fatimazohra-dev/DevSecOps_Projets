name: DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit semgrep
      - run: bandit -r app -f txt || true
      - run: semgrep --config auto app || true

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit -r app/requirements.txt || true

  iac:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: true

  container:
    name: Container (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vulnerable-lab:latest .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnerable-lab:latest
          severity: CRITICAL,HIGH
          exit-code: "0"

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: container
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t vulnerable-lab:latest .
          docker run -d -p 5000:5000 --name lab vulnerable-lab:latest
          sleep 8
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          fail_action: false
